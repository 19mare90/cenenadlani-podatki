
name: CeneNaDlani - spremljaj katalog SPAR

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Prenesi repozitorij
        uses: actions/checkout@v4

      - name: Nastavi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preveri katalog SPAR
        id: check
        continue-on-error: true
        run: python scripts/check_spar.py

      - name: Shrani rezultat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spar-monitor-result
          path: spar_monitor_result.json
          if-no-files-found: warn

      - name: Posodobi stanje kataloga
        if: steps.check.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/spar_catalog_state.json
          
if [ -f data/spar_catalog_state.json ]; then
  git add data/spar_catalog_state.json
  if ! git diff --cached --quiet; then
    git commit -m "Update SPAR catalogue state"
    git push
  fi
else
  echo "Datoteka stanja ne obstaja. Posodobitev preskocena."
fi


      - name: Sporoci nedostopen vir
        if: steps.check.outcome != 'success'
        run: |
          echo '### SPAR - vir ni bil dosegljiv' >> "$GITHUB_STEP_SUMMARY"
          echo 'Podatkov o cenah ni bilo mogoce preveriti.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Obstojece ponudbe niso spremenjene.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Status: preverjanje ni uspelo, potreben je ponovni poskus.' >> "$GITHUB_STEP_SUMMARY"
          echo '::warning::SPAR source unavailable; offers not verified.'

