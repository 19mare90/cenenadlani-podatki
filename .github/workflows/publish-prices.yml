name: CeneNaDlani - preveri in objavi cene
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/reviewed_offers.json'
      - 'data/products.json'
      - 'scripts/build_prices.py'
      - '.github/workflows/publish-prices.yml'
  schedule:
    - cron: '17 7 * * *'
      timezone: 'Europe/Ljubljana'
permissions:
  contents: read
concurrency:
  group: cenenadlani-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preveri ponudbe in pripravi JSON
        run: python scripts/build_prices.py
      - name: Pripravi objavo
        run: |
          mkdir -p public
          cp prices.json public/prices.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
